<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutZone - O Portal Definitivo do Futebol</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pitch: {
                            light: '#2e7d32',
                            DEFAULT: '#1b5e20',
                            dark: '#0d3b11'
                        },
                        accent: '#ffeb3b',
                        neon: '#00e676'
                    },
                    fontFamily: {
                        display: ['Teko', 'sans-serif'],
                        body: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        /* CSS Personalizado para a Prancheta Tática e Efeitos */
        .field-pattern {
            background-color: #1b5e20;
            background-image: repeating-linear-gradient(
                0deg,
                #1b5e20,
                #1b5e20 40px,
                #237229 40px,
                #237229 80px
            );
        }
        .player-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .player-card:hover {
            transform: translateY(-5px) scale(1.02);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-body antialiased min-h-screen flex flex-col justify-between selection:bg-neon selection:text-slate-950">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <!-- Logo -->
                <div class="flex items-center gap-3">
                    <div class="bg-gradient-to-tr from-green-500 to-emerald-300 p-2.5 rounded-xl shadow-lg shadow-green-500/20">
                        <i class="fa-solid fa-futbol text-2xl text-slate-950"></i>
                    </div>
                    <span class="font-display text-4xl font-bold tracking-wider bg-gradient-to-r from-white via-slate-200 to-green-400 bg-clip-text text-transparent">
                        FUT<span class="text-emerald-400">ZONE</span>
                    </span>
                </div>

                <!-- Navigation Desktop -->
                <nav class="hidden md:flex items-center space-x-1">
                    <button onclick="switchTab('noticias')" id="nav-noticias" class="nav-btn px-4 py-2 rounded-lg text-sm font-semibold transition-all text-emerald-400 bg-slate-800">
                        <i class="fa-solid fa-newspaper mr-2"></i>Notícias & Destaques
                    </button>
                    <button onclick="switchTab('tabela')" id="nav-tabela" class="nav-btn px-4 py-2 rounded-lg text-sm font-semibold text-slate-400 hover:text-white hover:bg-slate-800/50 transition-all">
                        <i class="fa-solid fa-trophy mr-2"></i>Tabelas
                    </button>
                    <button onclick="switchTab('escalacao')" id="nav-escalacao" class="nav-btn px-4 py-2 rounded-lg text-sm font-semibold text-slate-400 hover:text-white hover:bg-slate-800/50 transition-all">
                        <i class="fa-solid fa-shirt mr-2"></i>Monte seu Time
                    </button>
                    <button onclick="switchTab('quiz')" id="nav-quiz" class="nav-btn px-4 py-2 rounded-lg text-sm font-semibold text-slate-400 hover:text-white hover:bg-slate-800/50 transition-all">
                        <i class="fa-solid fa-brain mr-2"></i>Quiz Raiz
                    </button>
                </nav>

                <!-- Status ao Vivo Badge -->
                <div class="hidden lg:flex items-center gap-2 bg-slate-800/80 border border-slate-700/60 rounded-full px-3.5 py-1.5 text-xs">
                    <span class="relative flex h-2.5 w-2.5">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                    </span>
                    <span class="text-slate-300 font-medium">Champions League: <strong class="text-white">2 Jogos Ao Vivo</strong></span>
                </div>
            </div>
        </div>
    </header>

    <!-- Content Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">

        <!-- Banner Placar Histórico/Ao Vivo -->
        <section class="mb-8 overflow-x-auto pb-2">
            <div class="flex gap-4 min-w-max">
                <!-- Jogo 1 -->
                <div class="bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-xl p-4 w-64 transition-all">
                    <div class="flex justify-between items-center text-xs text-slate-400 mb-2">
                        <span>UEFA Champions League</span>
                        <span class="text-emerald-400 font-bold flex items-center gap-1"><i class="fa-solid fa-circle text-[8px] animate-pulse"></i> 68'</span>
                    </div>
                    <div class="flex justify-between items-center py-1">
                        <span class="font-semibold text-sm">Real Madrid</span>
                        <span class="font-display text-2xl font-bold text-emerald-400">2</span>
                    </div>
                    <div class="flex justify-between items-center py-1">
                        <span class="font-semibold text-sm">Manchester City</span>
                        <span class="font-display text-2xl font-bold text-emerald-400">1</span>
                    </div>
                </div>

                <!-- Jogo 2 -->
                <div class="bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-xl p-4 w-64 transition-all">
                    <div class="flex justify-between items-center text-xs text-slate-400 mb-2">
                        <span>Brasileirão Série A</span>
                        <span class="text-slate-500 font-medium">Hoje - 21:30</span>
                    </div>
                    <div class="flex justify-between items-center py-1">
                        <span class="font-semibold text-sm">Flamengo</span>
                        <span class="font-display text-2xl font-bold text-slate-500">-</span>
                    </div>
                    <div class="flex justify-between items-center py-1">
                        <span class="font-semibold text-sm">Palmeiras</span>
                        <span class="font-display text-2xl font-bold text-slate-500">-</span>
                    </div>
                </div>

                <!-- Jogo 3 -->
                <div class="bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-xl p-4 w-64 transition-all">
                    <div class="flex justify-between items-center text-xs text-slate-400 mb-2">
                        <span>Premier League</span>
                        <span class="text-slate-400 font-medium">Encerrado</span>
                    </div>
                    <div class="flex justify-between items-center py-1">
                        <span class="font-semibold text-sm">Arsenal</span>
                        <span class="font-display text-2xl font-bold">3</span>
                    </div>
                    <div class="flex justify-between items-center py-1">
                        <span class="font-semibold text-sm">Liverpool</span>
                        <span class="font-display text-2xl font-bold">1</span>
                    </div>
                </div>

                <!-- Jogo 4 -->
                <div class="bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-xl p-4 w-64 transition-all">
                    <div class="flex justify-between items-center text-xs text-slate-400 mb-2">
                        <span>Copa Libertadores</span>
                        <span class="text-slate-500 font-medium">Amanhã - 19:00</span>
                    </div>
                    <div class="flex justify-between items-center py-1">
                        <span class="font-semibold text-sm">Boca Juniors</span>
                        <span class="font-display text-2xl font-bold text-slate-500">-</span>
                    </div>
                    <div class="flex justify-between items-center py-1">
                        <span class="font-semibold text-sm">River Plate</span>
                        <span class="font-display text-2xl font-bold text-slate-500">-</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- SEÇÃO 1: NOTÍCIAS (Padrão Ativa) -->
        <div id="tab-noticias" class="tab-content space-y-8">
            <!-- Hero News -->
            <div class="relative rounded-2xl overflow-hidden group border border-slate-800 h-96 md:h-[450px]">
                <img src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=1200&q=80" alt="Futebol" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/60 to-transparent flex flex-col justify-end p-6 md:p-10">
                    <span class="inline
